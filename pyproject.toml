[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-economy-sdk"
version = "0.5.1"
authors = [{ name = "x402-avm contributors" }]
description = "Payment-gated MCP server SDK for Algorand"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["x402", "algorand", "avm", "mcp", "model-context-protocol", "payments", "micropayments", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "x402>=2.28,<3",
    "x402-algorand>=0.2.1",
    "fastmcp>=3.4,<4",
    "mcp>=1.29,<2",
    "py-algorand-sdk>=2.6",
    "httpx>=0.27",
    "starlette",
    "fastapi",
    "uvicorn>=0.30",
    "exceptiongroup>=1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/x402-avm/ai-economy-sdk"
Documentation = "https://x402-avm.github.io"
Repository = "https://github.com/x402-avm/ai-economy-sdk"
Issues = "https://github.com/x402-avm/ai-economy-sdk/issues"
Changelog = "https://github.com/x402-avm/ai-economy-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["ai_economy_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "ai_economy_sdk",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # The SDK must not call its own deprecated APIs or rely on its own changing defaults.
    "error::DeprecationWarning:ai_economy_sdk",
    "error::FutureWarning:ai_economy_sdk",
]

[tool.coverage.run]
source = ["ai_economy_sdk"]

[tool.coverage.report]
show_missing = true
