[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-economy-sdk"
version = "0.4.0"
authors = [
  { name = "AI Economy Team", email = "team@aieconomy.com" },
]
description = "Payment-gated MCP server SDK for Algorand"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["x402", "algorand", "avm", "mcp", "model-context-protocol", "payments", "micropayments", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "x402>=2.28,<3",
    "x402-algorand>=0.2.0",
    "fastmcp>=3.4,<4",
    "mcp>=1.29,<3",
    "py-algorand-sdk>=2.6",
    "httpx>=0.27",
    "starlette",
    "fastapi",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/x402-avm/ai-economy-sdk"
Documentation = "https://x402-avm.github.io"
Issues = "https://github.com/x402-avm/ai-economy-sdk/issues"
Changelog = "https://github.com/x402-avm/ai-economy-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ai_economy_sdk*"]
